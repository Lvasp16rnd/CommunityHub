version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.0.2
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./localstack-init/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    restart: unless-stopped

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/user_db
    depends_on:
      - mongodb

  incident-service:
    build: ./incident-service
    container_name: incident-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/incident_db
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
    depends_on:
      - mongodb
      - localstack

  poll-service:
    build: ./poll-service
    container_name: poll-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/poll_db
    depends_on:
      - mongodb

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
    depends_on:
      - localstack

volumes:
  mongodb_data:
