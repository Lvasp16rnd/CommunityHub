name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ] 
  pull_request:
    branches: [ "main", "develop" ] 

jobs:
  build:
    runs-on: ubuntu-latest 
    
    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin' 
        cache: maven 

    - name: Compilar o User Service
      run: cd user-service && mvn clean package -DskipTests

    - name: Compilar o Poll Service
      run: cd poll-service && mvn clean package -DskipTests

    - name: Compilar o Incident Service
      run: cd incident-service && mvn clean package -DskipTests

    - name: Compilar o Notification Service
      run: cd notification-service && mvn clean package -DskipTests
